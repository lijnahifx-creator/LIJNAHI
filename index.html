<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIJNAHI | Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 8%;
      background: rgba(0,0,0,.9);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .logo {
      color: #00ffd5;
      font-size: 25px;
      font-weight: bold;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #00ffd5;
    }

    .home {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 20px;
    }

    .home h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .home h1 span {
      color: #00ffd5;
    }

    .home p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 28px;
      border: 2px solid #00ffd5;
      border-radius: 30px;
      color: #00ffd5;
      text-decoration: none;
      transition: .3s;
    }

    .btn:hover {
      background: #00ffd5;
      color: #000;
    }

    @media(max-width:600px) {
      nav {
        padding: 18px;
      }

      nav a {
        margin-left: 8px;
        font-size: 13px;
      }

      .home h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">LIJNAHI</div>

    <div>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
    </div>
  </nav>

  <section class="home" id="home">
    <div>
      <h1>Hello, I'm <span>LIJNAHI</span></h1>

      <p>
        Web Developer • Software Engineering Learner
      </p>

      <a href="#projects" class="btn">
        View My Projects
      </a>
    </div>
  </section>

</body>
</html>
