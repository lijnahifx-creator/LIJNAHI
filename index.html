<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIJNAHI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#000;
  color:white;
  text-align:center;
}

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#00aaff,#7c3aed);
  font-size:55px;
  font-weight:bold;
  box-shadow:0 0 40px #00aaff;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 15px #00aaff}
  to{box-shadow:0 0 45px #7c3aed}
}

h1{
  margin-top:25px;
  font-size:55px;
  letter-spacing:5px;
  text-shadow:0 0 20px #00aaff;
}

.hero p{
  margin-top:15px;
  color:#aaa;
  font-size:18px;
}

.btn{
  margin-top:30px;
  padding:14px 30px;
  border:1px solid #00aaff;
  border-radius:30px;
  color:#00aaff;
  text-decoration:none;
}

section{
  max-width:800px;
  margin:25px auto;
  padding:30px 20px;
  background:#0a0a0a;
  border:1px solid #222;
  border-radius:20px;
}

h2{
  color:#00aaff;
  margin-bottom:15px;
}

section p{
  color:#bbb;
  line-height:1.7;
}

.social{
  margin-top:20px;
}

.social a{
  display:inline-block;
  margin:5px;
  padding:10px 18px;
  border:1px solid #333;
  border-radius:20px;
  color:#fff;
  text-decoration:none;
}

footer{
  padding:40px 20px;
  color:#555;
}
</style>
</head>

<body>

<div class="hero">

  <div class="avatar">L</div>

  <h1>LIJNAHI</h1>

  <p>Welcome to my personal website 🖤</p>

  <a class="btn" href="#about">Explore</a>

</div>

<section id="about">

  <h2>About Me</h2>

  <p>
    Hello! Welcome to my website.
    I enjoy learning, creating and exploring new ideas.
  </p>

</section>

<section>

  <h2>My Skills</h2>

  <p>HTML • CSS • Creativity • Learning</p>

</section>

<section>

  <h2>Connect</h2>

  <div class="social">
    <a href="#">Telegram</a>
    <a href="#">Instagram</a>
    <a href="#">TikTok</a>
  </div>

</section>

<footer>
  © 2026 LIJNAHI
</footer>

</body>
</html>
