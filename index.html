<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 70px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .intro {
      color: #aaa;
      font-size: 18px;
    }

    section {
      padding: 40px 20px;
      border-top: 1px solid #222;
    }

    h2 {
      margin-bottom: 20px;
    }

    .card {
      max-width: 500px;
      margin: 15px auto;
      padding: 20px;
      background: #111;
      border-radius: 15px;
    }

    a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>Your Name</h1>
    <p class="intro">Welcome to my personal website 👋</p>
  </header>

  <section>
    <h2>About Me</h2>
    <div class="card">
      <p>Hello! This is my personal website.</p>
    </div>
  </section>

  <section>
    <h2>My Skills</h2>
    <div class="card">📱 Mobile & Technology</div>
    <div class="card">🎮 Gaming</div>
    <div class="card">💻 Web Design</div>
  </section>

  <section>
    <h2>Contact</h2>
    <div class="card">
      <p>Telegram: @yourusername</p>
    </div>
  </section>

</body>
</html>
